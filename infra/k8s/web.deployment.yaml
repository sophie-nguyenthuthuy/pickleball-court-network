apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcn-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: pcn-web }
  template:
    metadata:
      labels: { app: pcn-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/pcn/pickleball-court-network/web:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: pcn-config } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: pcn-web }
spec:
  type: ClusterIP
  selector: { app: pcn-web }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
