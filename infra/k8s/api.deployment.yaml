apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcn-api
  labels: { app: pcn-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: pcn-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: pcn-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/pcn/pickleball-court-network/api:latest
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - secretRef: { name: pcn-api-secrets }
            - configMapRef: { name: pcn-config }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: pcn-api
spec:
  type: ClusterIP
  selector: { app: pcn-api }
  ports: [{ name: http, port: 80, targetPort: 4000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pcn-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pcn-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
