image:
  repository: ghcr.io/pcn/pickleball-court-network
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }

web:
  replicas: 2

admin:
  replicas: 1

worker:
  replicas: 2

postgres:
  external: true
  # if external=false, the chart installs a bitnami/postgresql subchart

redis:
  external: true

ingress:
  enabled: true
  className: nginx
  hosts:
    web: pcn.vn
    api: api.pcn.vn
    admin: admin.pcn.vn
  tls:
    enabled: true
    issuer: letsencrypt
